[pytest]
# Pytest Configuration File

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=agent
    --cov=monitor_agent
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-branch
    -ra
    --maxfail=1
    --durations=10

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow-running tests
    requires_es: Tests requiring Elasticsearch
    requires_system: Tests requiring system access

# Coverage options
[coverage:run]
source = agent,monitor_agent
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
